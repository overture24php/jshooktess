name: Build JSHook

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
        include:
          - abi: arm64-v8a
            dobby_abi: arm64-v8a
          - abi: armeabi-v7a
            dobby_abi: armeabi-v7a

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Download prebuilt Dobby
        run: |
          mkdir -p deps/Dobby/include deps/Dobby/lib
          # Download Dobby.h header
          curl -sL -o deps/Dobby/include/dobby.h \
            https://raw.githubusercontent.com/3equals3/DobbyHook/main/Dobby.h
          # Download prebuilt static lib
          curl -sL -o deps/Dobby/lib/libdobby.a \
            "https://github.com/3equals3/DobbyHook/raw/main/${{ matrix.dobby_abi }}/libdobby.a"

      - name: Configure JSHook
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_USE_PREBUILT=ON

      - name: Build JSHook
        run: |
          cmake --build build -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjshook-${{ matrix.abi }}
          path: build/libjshook.so
          if-no-files-found: error
